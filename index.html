<!DOCTYPE html>
<html>
<head>
<style>
.modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.modal-content {
  background: white;
  margin: 15% auto;
  padding: 20px;
  width: 300px;
  text-align: center;
}
</style>
</head>
<body>

<button onclick="openModal()">เปิด Pop-up</button>

<div id="myModal" class="modal">
  <div class="modal-content">
    <h3>ไปหน้าถัดไป?</h3>
    <button onclick="goNext()">ตกลง</button>
    <button onclick="closeModal()">ยกเลิก</button>
  </div>
</div>

<script>
function openModal() {
  document.getElementById("myModal").style.display = "block";
}

function closeModal() {
  document.getElementById("myModal").style.display = "none";
}

function goNext() {
  window.location.href = "nextpage.html";
}
</script>

</body>
</html>
